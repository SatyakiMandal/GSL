[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-event-impact-analyzer"
version = "1.0.0"
description = "Aligns Indian financial-press coverage against benchmark-adjusted stock returns to surface candidate incident days."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# FinBERT (primary, finance-tuned sentiment) and GoEmotions (secondary,
# general-purpose emotion texture) both load through transformers, so one
# extra covers both. Install the CPU torch wheel to avoid pulling CUDA:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
sentiment = ["torch>=2.0", "transformers>=4.40"]
prices = ["yfinance>=0.2.40"]
gui = ["streamlit>=1.30"]
# Not folded into "all": pip install alone is not enough to make this work -
# it also needs `playwright install chromium` afterward to fetch the browser
# binary, which every other extra here does not require. Left opt-in so
# `pip install -e ".[all]"` doesn't silently leave a broken PDF button behind.
pdf = ["playwright>=1.40"]
# pypdf is dev-only: one PDF test uses it to verify the rendered PDF's text
# content is actually extractable, not just "a PDF-shaped file exists". That
# test skips itself (pytest.importorskip) if pypdf isn't present, so it is
# not required to run the suite - just to get that one test's real coverage.
dev = ["pytest>=7.4", "pypdf>=4.0"]
all = [
    "torch>=2.0", "transformers>=4.40", "yfinance>=0.2.40", "streamlit>=1.30",
    "pytest>=7.4",
]

[project.scripts]
ceia-probe = "ceia.probe:main"
ceia-ingest = "ceia.ingest:main"
ceia-analyze = "ceia.analyze:main"
ceia-unlisted = "ceia.unlisted:main"

[tool.setuptools]
packages = ["ceia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
